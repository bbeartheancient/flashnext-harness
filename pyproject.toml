[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "neoharness"
version = "0.1.0"
description = "BPE (Belief/Progress/Experience) harness for the duty LLM on the bicameral n-gram buffer"
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["neoharness*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
